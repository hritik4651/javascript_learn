<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>DOM Part-2</title>
</head>

<body>
     <div class="parent">
          <div class="day">Monday</div>
          <div class="day">Tuesday</div>
          <div class="day">Wednesday</div>
          <div class="day">Thursday</div>
          <div class="day">Friday</div>
          <div class="day">Saturday</div>
          <div class="day">Sunday</div>
     </div>
     <div class="parent">
          <div class="weekend">Saturday</div>
          <div class="weekend">Sunday</div>
          <div class="boerder.bo"></div>
     </div>

     <script>

          const parent = document.querySelector(".parent")
          console.log(parent);
          console.log(parent.children);
          console.log(parent.children[2].innerHTML);
          const sevenDays = parent.querySelectorAll(".day")
          console.log(sevenDays);
          sevenDays.forEach((element) => {
               console.log(element.innerHTML)
               element.style.backgroundColor = "#212121"
               element.style.color = "#fff"
               element.style.padding = "6px"
               element.style.borderRadius = "20px"
          });
          // console.log(sevenDays);

          console.log(parent.firstElementChild);
          console.log(parent.lastElementChild);

          const dayOne = document.querySelector(".day")
          console.log(dayOne.parentElement);
          console.log(dayOne.nextElementSibling);

          console.log("Nodes : ", parent.childNodes);








     </script>

</body>

</html>
