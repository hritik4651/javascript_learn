<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
          body {
               font-family: Arial, sans-serif;
               margin: 50px;
          }

          .container {
               max-width: 400px;
               margin: 0 auto;
               padding: 20px;
               border: 1px solid #ccc;
               border-radius: 8px;
               background-color: #f9f9f9;
          }

          h1 {
               text-align: center;
               color: #45a049;
          }

          label {
               display: block;
               margin-bottom: 8px;
               font-weight: bold;
          }

          input {
               width: 100%;
               padding: 8px;
               margin-bottom: 16px;
               border: 1px solid #ccc;
               border-radius: 4px;
          }

          button {
               width: 100%;
               padding: 10px;
               background-color: #4CAF50;
               color: white;
               border: none;
               border-radius: 4px;
               cursor: pointer;
               font-size: 16px;
          }

          button:hover {
               background-color: #45a049;
          }

          .result {
               margin-top: 20px;
               font-size: 18px;
               text-align: center;
          }

          #goTOHome {
               color: #fff;
               font-size: 28px;
          }
     </style>
     <title>Project-2</title>
</head>

<body style="background-color: #212122;">

     <div class="mainContainer">
          <div class="header">
               <h1 style="text-align: center;padding: 8px;background-color: #212122;border-style: groove;color: #fff;">
                    Project-2
               </h1>
          </div>
          <div class="container">
               <h1>BMI Calculator</h1>
               <form>
                    <label for="weight">Weight (kg):</label>
                    <input type="text" id="weight" placeholder="Enter your weight in kg">

                    <label for="height">Height (cm):</label>
                    <input type="text" id="height" placeholder="Enter your height in cm">

                    <button>Calculate BMI</button>
               </form>
          </div>
          <div class="result" id="result"></div>
          <div class="info">
               <h3>Under Weight = Less than 18.6</h3>
               <h3>Normal Range = 18.6 and 24.9</h3>
               <h3>Over Weight = Greater than 24.9</h3>
          </div>
     </div>
     <div>
          <a id="goTOHome" href="../index.html">Home</a>
     </div>

</body>
<script>

     const form = document.querySelector("form")

     form.addEventListener("submit", (e) => {
          e.preventDefault()

          const weight = parseInt(document.querySelector("#weight").value)
          const height = parseInt(document.querySelector("#height").value)
          const result = document.querySelector("#result")
          console.log(result);

          if (weight === "" || weight < 0 || isNaN(weight)) {
               result.innerHTML = "Please Enter a Valid Weight"
          }
          if (height === "" || height < 0 || isNaN(height)) {
               result.innerHTML = "Please Enter a Valid height"
          } else {
               let bmi = (weight / ((height / 100) * (height / 100))).toFixed(1)
               result.innerHTML = `<h2>${bmi}</h2>`
          }
     })


</script>

</html>
